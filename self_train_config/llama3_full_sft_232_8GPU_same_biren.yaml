### model
model_name_or_path: /home/ksa/.cache/modelscope/hub/models/LLM-Research/Meta-Llama-3-8B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
# 强制禁用 Flash Attention 2 以对齐壁仞的 Vanilla Attention 表现
flash_attn: disabled 
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: chatml_alpaca_gpt4_zh
template: llama3
cutoff_len: 8192  # 对齐壁仞 SEQ=8192
max_samples: 1000000 
overwrite_cache: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 5.0e-6  # 对齐壁仞 LR
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0        # 对齐壁仞 Warmup
bf16: true
ddp_timeout: 180000000

### output
logging_steps: 1      # 对齐以观察 s/it
report_to: tensorboard 
output_dir: saves/llama3-8b/full/sft_default_same_biren_bs1